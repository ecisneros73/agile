<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python Task Manager</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <header><span class="eyebrow">FLASK · SQLITE · HARDENED NGINX</span><h1>Task Manager</h1><p>Your tasks, powered by Python.</p></header>
    <section class="panel">
      <h2 id="form-title">Add a task</h2>
      <form id="task-form">
        <label for="name">Task name</label><input id="name" maxlength="120" required placeholder="e.g. Review Terraform code">
        <label for="description">Description</label><textarea id="description" maxlength="2000" rows="3" placeholder="Details (optional)"></textarea>
        <div class="actions"><button type="submit" id="save">Add task</button><button type="button" id="cancel" class="secondary" hidden>Cancel edit</button></div>
      </form>
    </section>
    <section class="panel"><div class="list-heading"><h2>Your tasks <span id="count">(0)</span></h2><input id="search" aria-label="Search tasks" placeholder="Search tasks…"></div><p id="status" role="status" aria-live="polite"></p><ul id="task-list"></ul></section>
  </main>
</body>
</html>
