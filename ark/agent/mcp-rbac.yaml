apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubernetes-mcp-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - events
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubernetes-mcp-reader-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp-server
    namespace: default
roleRef:
  kind: Role
  name: kubernetes-mcp-reader
  apiGroup: rbac.authorization.k8s.io