apiVersion: ark.mckinsey.com/v1alpha1
kind: Model
metadata:
  name: default
  namespace: default
spec:
  provider: openai
  model:
    value: llama3.2:3b
  config:
    openai:
      baseUrl:
        value: "http://ollama.ollama.svc.cluster.local:11434/v1"
      apiKey:
        valueFrom:
          secretKeyRef:
            name: ollama-api-key
            key: token